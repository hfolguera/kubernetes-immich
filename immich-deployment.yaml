apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server2
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-server
    spec:
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:v3.3.5
          envFrom:
            - configMapRef:
                name: immich-config
            - secretRef:
                name: immich-secrets
          ports:
            - name: http
              containerPort: 2283
          volumeMounts:
            - name: library
              mountPath: /data
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: immich-data-pv-claim
        - name: localtime
          hostPath:
            path: /etc/localtime
            type: File
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning2
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-machine-learning
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-machine-learning
    spec:
      containers:
        - name: immich-machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:v3.3.5
          envFrom:
            - configMapRef:
                name: immich-config
            - secretRef:
                name: immich-secrets
          volumeMounts:
            - name: model-cache
              mountPath: /cache
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: immich-ml-pv-claim
