apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-data-pv-claim
  namespace: immich
  labels:
    app: immich
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Ti
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-ml-pv-claim
  namespace: immich
  labels:
    app: immich
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
